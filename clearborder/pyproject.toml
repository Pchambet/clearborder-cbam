# Tool configuration only; dependencies are pinned in requirements*.txt.

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
extend-select = ["I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"dashboard/app.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --tb=short"
